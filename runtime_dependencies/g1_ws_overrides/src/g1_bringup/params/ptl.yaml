pointcloud_to_laserscan:
  ros__parameters:
    target_frame: "base_footprint"
    queue_size: 5
    transform_tolerance: 0.2
    # Ignore floor/foot-swing noise and low traversable clutter.
    # Raise this only after measured obstacle-clearance tests.
    min_height: 0.22
    max_height: 1.60
    angle_min: -3.14
    angle_max: 3.14
    angle_increment: 0.0174
    scan_time: 0.1
    range_min: 0.25
    range_max: 40.0
    use_inf: true
    inf_epsilon: 1.0
    concurrency_level: 0

amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.2
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.2
    laser_model_type: "likelihood_field"
    max_beams: 120
    max_particles: 3000
    min_particles: 800
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1
    recovery_alpha_slow: 0.001
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.5
    update_min_a: 0.05
    update_min_d: 0.05
    z_hit: 0.8
    z_max: 0.05
    z_rand: 0.2
    z_short: 0.05
    scan_topic: /scan
    map_topic: /map
    # Never force the robot to map origin. Wait for RViz 2D Pose Estimate,
    # then let the particle filter refine that guess from live LiDAR scans.
    set_initial_pose: false
    always_reset_initial_pose: true
    first_map_only: false

emcl2:
  ros__parameters:
    odom_freq: 20
    transform_tolerance: 0.5
    global_frame_id: "map"
    odom_frame_id: "odom"
    # base_frame_id: "pelvis"
    base_frame_id: "base_link"
    footprint_frame_id: "base_footprint"
    # footprint_frame_id: "pelvis"
    laser_min_range: 0.1
    laser_max_range: 100000000.0
    scan_increment: 3
    initial_pose_x: 0.0
    initial_pose_y: 0.0
    initial_pose_a: 0.0
    num_particles: 2000
    alpha_threshold: 0.5
    expansion_radius_position: 0.05 # 0.1
    expansion_radius_orientation: 0.1 # 0.2
    extraction_rate: 0.1
    range_threshold: 0.2 # 0.3
    sensor_reset: false
    # odom_fw_dev_per_fw: 0.05 # 0.30
    # odom_fw_dev_per_rot: 0.02 # 0.05
    # odom_rot_dev_per_fw: 0.05 # 0.20
    # odom_rot_dev_per_rot: 0.10 # 0.40
    odom_fw_dev_per_fw: 0.10
    odom_fw_dev_per_rot: 0.05
    odom_rot_dev_per_fw: 0.10
    odom_rot_dev_per_rot: 0.20
    laser_likelihood_max_dist: 0.2 # 0.2

# copy from https://raw.githubusercontent.com/ros-navigation/navigation2/refs/heads/humble/nav2_bringup/params/nav2_params.yaml
bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    # Keep Nav2 planar. base_link follows pelvis roll/pitch while walking and
    # makes the controller/costmaps appear to oscillate even on a straight path.
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    #default_nav_through_poses_bt_xml: "/home/unitree/colcon_ws/src/erasers_g1/navigate_through_poses_w_replanning_and_recovery.xml"
    #default_nav_to_pose_bt_xml: "/home/unitree/colcon_ws/src/erasers_g1/navigate_to_pose_w_replanning_and_recovery.xml"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
